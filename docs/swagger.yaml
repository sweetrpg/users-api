definitions:
  models.UserIdentity:
    properties:
      email:
        type: string
      id:
        type: string
      subject:
        type: string
    type: object
  server.adminStatsHistoryEntry:
    properties:
      date:
        type: string
      new_users:
        type: integer
      total_users:
        type: integer
    type: object
  server.adminStatsResponse:
    properties:
      active_users:
        type: integer
      new_users:
        type: integer
      total_users:
        type: integer
    type: object
  server.friendEntry:
    properties:
      email:
        type: string
      name:
        type: string
      since:
        type: string
      user_id:
        type: string
    type: object
  server.friendRequestResponse:
    properties:
      id:
        type: string
      status:
        type: string
      user_id:
        type: string
    type: object
  server.friendsResponse:
    properties:
      friends:
        items:
          $ref: '#/definitions/server.friendEntry'
        type: array
    type: object
  server.pendingRequestEntry:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      user_id:
        type: string
    type: object
  server.pendingRequestsResponse:
    properties:
      incoming:
        items:
          $ref: '#/definitions/server.pendingRequestEntry'
        type: array
      outgoing:
        items:
          $ref: '#/definitions/server.pendingRequestEntry'
        type: array
    type: object
  server.profileResponse:
    properties:
      bio:
        type: string
      email:
        type: string
      name:
        type: string
      user_id:
        type: string
      username:
        type: string
      website:
        type: string
    type: object
  server.provisionRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  server.provisionResponse:
    properties:
      created:
        type: boolean
      userId:
        type: string
    type: object
  server.resolveSubjectsRequest:
    properties:
      subjects:
        items:
          type: string
        type: array
    type: object
  server.sendFriendRequestRequest:
    properties:
      identifier:
        description: |-
          Identifier is a User.id, an email, or a username - resolved server-side to the target
          user (see models.ResolveFriendTarget).
        type: string
    type: object
  server.updateProfileRequest:
    properties:
      bio:
        type: string
      name:
        type: string
      username:
        type: string
      website:
        type: string
    type: object
  vo.ErrorVO:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  vo.HealthResponseVO:
    properties:
      collections:
        items:
          type: string
        type: array
      database:
        type: string
      errors:
        type: integer
      messages:
        items:
          type: string
        type: array
      ping:
        type: string
    type: object
  vo.PingResponseVO:
    properties:
      date:
        type: string
      hostname:
        type: string
    type: object
info:
  contact:
    email: admin@sweetrpg.com
    name: API Support
    url: https://sweetrpg.com
  description: Swagger APIs
  license:
    name: MIT
    url: https://mit-license.org/
  termsOfService: https://pilgrimagesoftware.com/terms/
  title: Users API service
  version: "1.0"
paths:
  /admin/stats:
    get:
      description: Total user count, active user count (login within a rolling 30-day
        window), and new user count (created within a rolling 7-day window)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.adminStatsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Get user population stats
      tags:
      - admin
  /admin/stats/history:
    get:
      description: Per-day total and new user counts, oldest first, last element is
        today
      parameters:
      - description: Number of days back to include (default 30, clamped to [1, 90])
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.adminStatsHistoryEntry'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Daily user-growth history
      tags:
      - admin
  /admin/users:
    get:
      description: List user identities
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.UserIdentity'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: List user identities
      tags:
      - admin
  /friends:
    get:
      description: List the caller's accepted mutual friendships
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.friendsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: List friends
      tags:
      - friends
  /friends/{id}:
    delete:
      description: Remove an existing accepted friendship
      parameters:
      - description: Friendship id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Remove a friendship
      tags:
      - friends
  /friends/requests:
    get:
      description: List the caller's pending friend requests, split into incoming
        and outgoing
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.pendingRequestsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: List pending friend requests
      tags:
      - friends
    post:
      consumes:
      - application/json
      description: Send a friend request to another user, identified by User.id, email,
        or username
      parameters:
      - description: Target user identifier
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.sendFriendRequestRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.friendRequestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Send a friend request
      tags:
      - friends
  /friends/requests/{id}/accept:
    post:
      description: Accept or decline a pending friend request the caller received
      parameters:
      - description: Friendship id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Respond to a pending friend request
      tags:
      - friends
  /internal/identities/provision:
    post:
      consumes:
      - application/json
      description: Find or create a User/LoginProfile for the caller's own Auth0 identity
      parameters:
      - description: Provisioning request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.provisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.provisionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Provision a user identity
      tags:
      - internal
  /internal/resolve-subjects:
    post:
      consumes:
      - application/json
      description: Resolve a batch of Auth0 subjects to the canonical users._id each
        maps to
      parameters:
      - description: Subjects to resolve
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.resolveSubjectsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Resolve subjects to user ids
      tags:
      - internal
  /profile:
    get:
      description: Get the caller's own profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.profileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Get the caller's own profile
      tags:
      - profile
    patch:
      consumes:
      - application/json
      description: Update the caller's own profile
      parameters:
      - description: Profile update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.updateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.profileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Update the caller's own profile
      tags:
      - profile
  /status/health:
    get:
      description: Health check
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vo.HealthResponseVO'
      summary: Health check
      tags:
      - status
  /status/ping:
    get:
      description: Ping
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vo.PingResponseVO'
      summary: Ping
      tags:
      - status
swagger: "2.0"
