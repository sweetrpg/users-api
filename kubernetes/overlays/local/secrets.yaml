---
# Local dev only - points at the shared, no-auth MongoDB in sweetrpg-support
# (sweetrpg/common-infrastructure's database module) instead of the real Atlas cluster dev/prod
# use (see that ExternalSecret in kubernetes/overlays/dev/secrets.yaml). This cluster's network
# can't reliably reach Atlas - confirmed via TCP-level testing while debugging admin-api's
# failing readiness probe (same shared Atlas cluster).
apiVersion: v1
kind: Secret

metadata:
    name: api-db

type: Opaque
stringData:
    DATABASE_URL: mongodb://mongodb.sweetrpg-support.svc.cluster.local:27017/sweetrpg-user

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: users-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    data:
        - secretKey: AUTH0_DOMAIN
          remoteRef:
              key: /sweetrpg/dev/auth/auth0
              property: AUTH0_DOMAIN
        - secretKey: AUTH0_AUDIENCE
          remoteRef:
              key: /sweetrpg/dev/auth/auth0
              property: AUTH0_AUDIENCE
    dataFrom:
        # Same shared secret admin-web's local overlay reads as USERS_API_INTERNAL_SERVICE_TOKEN -
        # see the dev overlay's secrets.yaml for the full rationale.
        - extract:
              key: /sweetrpg/admin/web/users-api
          rewrite:
              - regexp:
                    source: "USERS_API_INTERNAL_SERVICE_TOKEN"
                    target: "INTERNAL_SERVICE_TOKEN"
