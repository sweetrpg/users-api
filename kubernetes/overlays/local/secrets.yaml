---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: users-api-db

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-db
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/user/api/db

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: users-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    data:
        - secretKey: AUTH0_DOMAIN
          remoteRef:
              key: /sweetrpg/dev/auth/auth0
              property: AUTH0_DOMAIN
        - secretKey: AUTH0_AUDIENCE
          remoteRef:
              key: /sweetrpg/dev/auth/auth0
              property: AUTH0_AUDIENCE
    dataFrom:
        # Same shared secret admin-web's local overlay reads as USERS_API_INTERNAL_SERVICE_TOKEN -
        # see the dev overlay's secrets.yaml for the full rationale.
        - extract:
              key: /sweetrpg/admin/web/users-api
          rewrite:
              - regexp:
                    source: "USERS_API_INTERNAL_SERVICE_TOKEN"
                    target: "INTERNAL_SERVICE_TOKEN"
