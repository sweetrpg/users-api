---
# Local dev only - points at the shared, no-auth MongoDB in sweetrpg-db
# (sweetrpg/common-infrastructure's database module) instead of the real Atlas cluster dev/prod
# use (see that ExternalSecret in kubernetes/overlays/dev/secrets.yaml). This cluster's network
# can't reliably reach Atlas - confirmed via TCP-level testing while debugging admin-api's
# failing readiness probe (same shared Atlas cluster).
apiVersion: v1
kind: Secret

metadata:
    name: api-db

type: Opaque
stringData:
    DB_URI: mongodb://mongodb.sweetrpg-db.svc.cluster.local:27017/sweetrpg-user

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: users-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    dataFrom:
        # Same Akeyless path as the dev overlay - a shared secret, not environment-specific
        # infra, so local uses the same real value rather than a hardcoded stand-in. See
        # kubernetes/overlays/dev/secrets/misc.yaml.
        - extract:
              key: /sweetrpg/auth/web/users-api
