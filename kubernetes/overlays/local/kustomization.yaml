apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-users

resources:
    - ../../base
    - configmaps.yaml
    - secrets.yaml
    - middlewares.yaml
    - ingress.yaml

labels:
    - pairs:
          app.kubernetes.io/name: users-api
          app.kubernetes.io/version: v1
          app.kubernetes.io/component: api
          app.kubernetes.io/part-of: users
          com.sweetrpg/env: local
      includeSelectors: false
      includeTemplates: true

generatorOptions:
    disableNameSuffixHash: true

images:
    - name: users-api
      newName: ghcr.io/sweetrpg/users-api
      newTag: latest
