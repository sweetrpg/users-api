---
# users-api's own database user, scoped to only its own database - the shared "sweetrpg" user
# (readWriteAnyDatabase) is not for service use. Same pattern as admin-api's own
# kubernetes/overlays/dev/atlas-db-user.yaml.
apiVersion: atlas.mongodb.com/v1
kind: AtlasDatabaseUser

metadata:
  name: users-api

spec:
  databaseName: admin
  username: users-api
  passwordSecretRef:
    name: users-api-db-credentials
  projectRef:
    name: sweetrpg
    namespace: sweetrpg-db
  roles:
    - databaseName: sweetrpg-users
      roleName: readWrite
  x509Type: NONE
