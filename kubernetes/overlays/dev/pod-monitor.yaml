---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor

metadata:
  name: sweetrpg-users-api
  labels:
    release: prometheus

spec:
  podMetricsEndpoints:
    - port: http
  selector:
    matchLabels:
        platform: sweetrpg
        app: api
        package: users
        component: api
  namespaceSelector:
    matchNames:
      - sweetrpg-users
