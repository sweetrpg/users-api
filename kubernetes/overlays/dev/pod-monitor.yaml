---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor

metadata:
  name: sweetrpg-users-api
  labels:
    release: prometheus

spec:
  podMetricsEndpoints:
    - port: http
  selector:
    matchLabels:
        platform: sweetrpg
        app: api
        # Matches the pod template's own label (deployment.yaml), not the overlay's
        # kustomization-level `package: users` metadata label - these two intentionally differ
        # (see deployment.yaml's selector) and only the pod template's value is what a
        # PodMonitor's selector needs to match. Was "users" (plural) here, which never matched
        # any pod, so this service was never actually scraped.
        package: user
        component: api
  namespaceSelector:
    matchNames:
      - sweetrpg-users
