---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: users-api-db

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-db
        creationPolicy: Owner
    dataFrom:
        # Must have a key named DATABASE_URL (a MongoDB connection string) - see configure.swift.
        - extract:
              key: /sweetrpg/user/api/db

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: users-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    data:
        # Same shared Auth0 application auth-web registers - AUTH0_DOMAIN/AUTH0_AUDIENCE only
        # (this service verifies tokens, it never originates the Authorization Code flow, so it
        # has no use for AUTH0_CLIENT_ID/AUTH0_CLIENT_SECRET - selected individually here rather
        # than pulling the whole secret via dataFrom, so this pod's env never holds the client
        # secret). Not populated yet - see sweetrpg/auth-web's kubernetes/overlays/dev/secrets.yaml
        # for the same gap.
        - secretKey: AUTH0_DOMAIN
          remoteRef:
              key: /sweetrpg/dev/auth/auth0
              property: AUTH0_DOMAIN
        - secretKey: AUTH0_AUDIENCE
          remoteRef:
              key: /sweetrpg/dev/auth/auth0
              property: AUTH0_AUDIENCE
    dataFrom:
        # Must be the exact same value as admin-web's USERS_API_INTERNAL_SERVICE_TOKEN (see
        # sweetrpg/admin-web's kubernetes/overlays/dev/secrets.yaml and this repo's
        # Sources/App/Services/InternalServiceAuth.swift) - rewrite maps the Akeyless key admin-web
        # reads as USERS_API_INTERNAL_SERVICE_TOKEN onto the env var name this app reads,
        # INTERNAL_SERVICE_TOKEN, so both sides pull from one shared secret value instead of two
        # that could drift apart.
        - extract:
              key: /sweetrpg/admin/web/users-api
          rewrite:
              - regexp:
                    source: "USERS_API_INTERNAL_SERVICE_TOKEN"
                    target: "INTERNAL_SERVICE_TOKEN"
