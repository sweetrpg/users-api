---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: users-api-db

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-db
        creationPolicy: Owner
    dataFrom:
        # Must have a key named DATABASE_URL (a MongoDB connection string) - see configure.swift.
        - extract:
              key: /sweetrpg/users/api/db

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: users-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    dataFrom:
        # Must be the exact same value as admin-web's USERS_API_INTERNAL_SERVICE_TOKEN (see
        # sweetrpg/admin-web's kubernetes/overlays/dev/secrets.yaml and this repo's
        # Sources/App/Services/InternalServiceAuth.swift) - rewrite maps the Akeyless key admin-web
        # reads as USERS_API_INTERNAL_SERVICE_TOKEN onto the env var name this app reads,
        # INTERNAL_SERVICE_TOKEN, so both sides pull from one shared secret value instead of two
        # that could drift apart. This gate now covers only AdminUsersController's minimal
        # id/email listing - see sweetrpg/platform's split-authz-into-auth-api change; the
        # broader authz surface (JWKS verification, roles, /authz/check) moved to auth-api.
        - extract:
              key: /sweetrpg/admin/web/users-api
          rewrite:
              - regexp:
                    source: "USERS_API_INTERNAL_SERVICE_TOKEN"
                    target: "INTERNAL_SERVICE_TOKEN"
