apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-users

resources:
    - ../../base
    - atlas-db-user.yaml
    - configmaps.yaml
    - ingress.yaml
    - middlewares.yaml
    - pod-monitor.yaml
    - secrets/db-creds.yaml
    - secrets/db.yaml

labels:
    - pairs:
          app.kubernetes.io/name: users-api
          app.kubernetes.io/version: v1
          app.kubernetes.io/component: api
          app.kubernetes.io/part-of: users
          com.sweetrpg/env: dev
      includeSelectors: false
      includeTemplates: true

generatorOptions:
    disableNameSuffixHash: true
