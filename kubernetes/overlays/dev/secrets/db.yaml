---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: users-api-db

spec:
    refreshInterval: 12h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-db
        creationPolicy: Owner
    dataFrom:
        # Same pattern as admin-api/catalog-api: Akeyless stores the field as DB_PASSWORD,
        # rewritten to DB_PW here since that's the env var name configure.swift builds the
        # Mongo connection string from (see kubernetes/base/configmaps.yaml's DB_SCHEME/DB_HOST/
        # DB_USER/DB_NAME/DB_OPTS for the rest of the parts).
        - extract:
              key: /sweetrpg/users/api/db
          rewrite:
              - regexp:
                    source: "DB_PASSWORD"
                    target: "DB_PW"
