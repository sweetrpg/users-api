---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: users-api-misc

spec:
    refreshInterval: 12h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    dataFrom:
        # The secret auth-api and admin-web already share (admin-web reads it as
        # AUTH_API_INTERNAL_SERVICE_TOKEN, auth-api as INTERNAL_SERVICE_TOKEN). auth-api presents
        # it to POST /internal/resolve-subjects, where it has no end-user bearer token to forward.
        - extract:
              key: /sweetrpg/admin/web/auth-api
          rewrite:
              - regexp:
                    source: "AUTH_API_INTERNAL_SERVICE_TOKEN"
                    target: "INTERNAL_SERVICE_TOKEN"
