---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: users-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    dataFrom:
        # Shared with auth-web's own ExternalSecret at this same path - see
        # sweetrpg/platform's add-users-api-provisioning design.md. auth-web presents this as
        # the X-Internal-Service-Token header when calling POST /internal/identities/provision
        # mid-login, before it has a forwarded user bearer token to present instead.
        - extract:
              key: /sweetrpg/auth/web/users-api
