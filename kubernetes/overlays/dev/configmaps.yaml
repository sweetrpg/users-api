---
apiVersion: v1
kind: ConfigMap

metadata:
  name: api-env

data:
  ENV: dev
  PORT: "8080"
  # Own Vapor session store, distinct from the suite-wide shared session on index 2 - see
  # docs/frontend-conventions.md's "Shared sweetrpg-support Redis instance" registry
  # (sweetrpg/platform) before changing this index.
  REDIS_HOST: redis.sweetrpg-support.svc.cluster.local
  REDIS_PORT: "6379"
  REDIS_DB: "3"
  BUILD_INFO_PATH: /app/config/build-info.json
  LOG_LEVEL: info
