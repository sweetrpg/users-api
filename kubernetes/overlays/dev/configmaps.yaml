---
apiVersion: v1
kind: ConfigMap

metadata:
  name: api-env

data:
  ENV: dev
  # mongodb.go builds the connection string from these DB_* parts rather than one opaque
  # DB_URI - only the password (DB_PW, in secrets.yaml) is sensitive. DB_HOST is Atlas's own
  # SRV hostname for Cluster0 - not secret, but not derivable from anything else in this repo.
  DB_SCHEME: mongodb+srv
  DB_HOST: cluster0.z9nxg.mongodb.net
  DB_USER: users-api
  DB_NAME: sweetrpg-users
  DB_OPTS: retryWrites=true&w=majority
  PORT: "8080"
  # This service's own dedicated Redis instance in sweetrpg-users - its own Vapor session store,
  # distinct from and unrelated to auth-web's suite-wide shared session in sweetrpg-auth. See
  # docs/frontend-conventions.md's "Per-namespace Redis instances" registry (sweetrpg/platform).
  REDIS_HOST: redis.sweetrpg-users.svc.cluster.local
  REDIS_PORT: "6379"
  BUILD_INFO_PATH: /app/config/build-info.json
  LOG_LEVEL: info
